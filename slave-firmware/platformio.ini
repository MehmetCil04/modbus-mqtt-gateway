; Separate PlatformIO project for the Modbus slave used in the Wokwi
; multi-board simulation. Builds a small ESP32 firmware that pretends to
; be a PZEM-like industrial energy meter on the RS485 bus.

[env:wokwi-slave]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    emelianov/modbus-esp8266@^4.1.0

build_flags =
    -DCORE_DEBUG_LEVEL=2
