services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: gw-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: gw-influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: changeme123
      DOCKER_INFLUXDB_INIT_ORG: gateway
      DOCKER_INFLUXDB_INIT_BUCKET: telemetry
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: gateway-dev-token
    volumes:
      - influxdb_data:/var/lib/influxdb2
    restart: unless-stopped

  telegraf:
    image: telegraf:1.30
    container_name: gw-telegraf
    depends_on:
      - mosquitto
      - influxdb
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: gw-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - influxdb
    restart: unless-stopped

  # ── Hardware-free simulation ──────────────────────────────────────────
  # modbus-slave acts as a fake industrial energy meter speaking real
  # Modbus TCP. gateway-sim is a Python twin of the ESP32 firmware that
  # reads it and publishes to MQTT — same topic/JSON contract.

  modbus-slave:
    build: ../simulators
    container_name: gw-modbus-slave
    command: ["python", "modbus_slave.py"]
    environment:
      SLAVE_PORT: "5020"
      SLAVE_ID: "1"
    restart: unless-stopped

  gateway-sim:
    build: ../simulators
    container_name: gw-sim
    command: ["python", "gateway.py"]
    environment:
      MODBUS_HOST: modbus-slave
      MODBUS_PORT: "5020"
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      DEVICE_ID: gw-sim
      TOPIC_PREFIX: gateway
      SLAVE_ID: "1"
    depends_on:
      - modbus-slave
      - mosquitto
    restart: unless-stopped

volumes:
  mosquitto_data:
  mosquitto_log:
  influxdb_data:
  grafana_data:
