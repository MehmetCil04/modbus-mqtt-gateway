[agent]
  interval = "10s"
  flush_interval = "10s"
  hostname = "telegraf"
  omit_hostname = false

# Local Mosquitto: Python full-stack simulator (gw-sim) and any real ESP32
# devices flashed on the LAN.
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = [
    "gateway/+/voltage",
    "gateway/+/current",
    "gateway/+/power",
    "gateway/+/temperature",
  ]
  qos = 0
  client_id = "telegraf-gateway-local"
  data_format = "json"
  json_string_fields = ["unit"]
  name_override = "gateway"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "gateway/+/+"
    tags = "_/device/tag"

# Public broker bridge: the Wokwi virtual ESP32 (device id gw-01) publishes
# here over the simulator's WiFi. Telegraf pulls those readings into the
# same InfluxDB bucket so Grafana shows Wokwi alongside the Python sim.
# Status (retained "online"/"offline") topic is excluded so non-JSON
# payloads don't trip the parser.
[[inputs.mqtt_consumer]]
  servers = ["tcp://test.mosquitto.org:1883"]
  topics = [
    "gateway/gw-01/voltage",
    "gateway/gw-01/current",
    "gateway/gw-01/power",
    "gateway/gw-01/temperature",
  ]
  qos = 0
  client_id = "telegraf-gateway-mcil04-wokwi"
  data_format = "json"
  json_string_fields = ["unit"]
  name_override = "gateway"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "gateway/+/+"
    tags = "_/device/tag"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "gateway-dev-token"
  organization = "gateway"
  bucket = "telemetry"
