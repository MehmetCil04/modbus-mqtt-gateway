[agent]
  interval = "10s"
  flush_interval = "10s"
  hostname = "telegraf"
  omit_hostname = false

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics  = ["gateway/+/+"]
  qos = 0
  client_id = "telegraf-gateway"
  data_format = "json"
  json_string_fields = ["unit"]
  name_override = "gateway"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "gateway/+/+"
    tags = "_/device/tag"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "gateway-dev-token"
  organization = "gateway"
  bucket = "telemetry"
